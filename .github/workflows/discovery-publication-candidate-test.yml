name: DISCOVERY publication candidate focused test

on:
  push:
    branches:
      - gate4b-action-snapshot-candidate-20261024

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile publisher
        run: python -m py_compile scripts/apply_publication_request.py scripts/test_apply_publication_request.py
      - name: Run focused publication tests
        run: python -m unittest scripts/test_apply_publication_request.py -v
